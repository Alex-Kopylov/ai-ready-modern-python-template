# Taplo TOML Configuration
# https://taplo.tamasfe.dev/configuration/

# Include all TOML files in project
include = ["**/*.toml"]

# Exclude common directories. Taplo ignores .gitignore, so the AI agent
# directories from the prek global exclude are listed too: they can hold other
# branches' worktrees, which lint-toml and `mise run format` must not touch.
exclude = [
  "**/node_modules/**",
  "**/target/**",
  "**/.venv/**",
  "**/.claude/**",
  "**/.codex/**",
  "**/.cursor/**",
  "**/.gemini/**",
]

[formatting]
# The two array options below are load-bearing: removing either makes a fresh
# render drift under taplo fmt --check in .ruff.toml and mise.toml.
# All other options deliberately pin Taplo's current defaults against upstream
# drift; they are intentional, not dead configuration.

# Keep table entries unaligned
align_entries = false
# Keep entries flush with their table
indent_entries = false
# Keep subtable headers unindented
indent_tables = false
# Preserve intentional single-line and multiline arrays
array_auto_collapse = false
array_auto_expand = false
# Keep spaces inside inline tables
compact_inline_tables = false
# Preserve manual key ordering
reorder_keys = false
